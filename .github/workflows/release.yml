name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: petplay-linux-x64
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: petplay-windows-x64
      - name: Hash desktop executables
        run: |
          cd dist
          sha256sum petplay petplay.exe > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/petplay
            dist/petplay.exe
            dist/SHA256SUMS
            resources/licenses/raylib.txt
            resources/licenses/scap.txt
